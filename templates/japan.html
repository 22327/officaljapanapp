{% extends "layout.html" %}
{%block content %}

<div class="two-column">
    <img src="{{ result[6] }}" alt="Image of {{ result[2] }}">

    <div class="info">
        <h1>Letter: {{ result[2] }}</h1>
        <h1>English: {{ result[3] }}</h1>
        <h1>Description: {{ result[5] }}</h1>
        <h1>Words: {{ result[4] }}</h1>
        <h1>Pronunciation: <audio src="{{ result[7] }}" controls></audio></h1>

    </div>  

</div>
{%endblock%}
