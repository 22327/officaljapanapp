<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="12222real.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />

   

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="http://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


    <title>Japanese Learning App</title>
</head>
<body class="w3-container">
<header class="w3-container w3-padding-32 top-header">

    <div class="container">
    <img src="https://m.media-amazon.com/images/I/51KomX7KPZL._AC_UF894,1000_QL80_.jpg" alt="Japanese Learning App">
    <h1>Cool Japanese Learn</h1>
    </div>  

    <form method="POST" action="{{ url_for('submit') }}" class="login-form">

        <input
            type="text"
            name="username"
            placeholder="Username"
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
        >

        <button type="submit">Login</button>

    </form>

</header>

    <nav class="w3-bar w3-red">
        <a href="/" class="w3-bar-item w3-button">Home</a>
        <a href= "{{ url_for('maker', id=0) }}" class="w3-bar-item w3-button">Hiragana</a>
        <a href= "{{ url_for('maker', id=1) }}" class="w3-bar-item w3-button">Katakana</a>
        <a href="{{ url_for('history') }}" class="w3-bar-item w3-button">History</a>
        <a href="{{ url_for('contact') }}" class="w3-bar-item w3-button">Contact</a>
    </nav>

{% block search %}
   
{% endblock %}

    {% block content %}
    {% endblock %}
    
</body>
</html>
